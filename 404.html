<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Rodrigo Molina Ávila</title>
<meta name="robots" content="noindex">

<link rel="stylesheet" href="/RodrigoMolinaAvila/assets/fonts/fonts.css">
<style>
:root{--canvas:#F7F5F0;--ink:#1D1B17;--ink-soft:#5F5B52;--accent:#003DA5;--border:#E2DFD6}
@media(prefers-color-scheme:dark){:root{--canvas:#12110F;--ink:#EAE7DF;--ink-soft:#A39E92;--accent:#8FB3F5;--border:#2C2B26}}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:var(--canvas);color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif;text-align:center;padding:2rem}
h1{font-family:'Fraunces',serif;font-size:clamp(4rem,16vw,9rem);line-height:1;letter-spacing:-.03em;color:var(--accent)}
p{color:var(--ink-soft);margin:1.2rem auto 0;max-width:44ch;font-size:1rem}
a{display:inline-block;margin-top:2rem;padding:.7rem 1.4rem;border:1px solid var(--accent);border-radius:999px;
  color:var(--accent);text-decoration:none;font-weight:600;font-size:.9rem;transition:background .2s,color .2s}
a:hover{background:var(--accent);color:var(--canvas)}
</style>
</head>
<body>
  <main>
    <h1>404</h1>
